line-length = 120

[lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "B008",  # Do not perform function call `Depends` in argument defaults (FastAPI standard pattern)
    "E501",  # Line too long
]

[lint.per-file-ignores]
"alembic/*" = ["F401", "F403", "E402"]
"app/infrastructure/database.py" = ["E402"]
